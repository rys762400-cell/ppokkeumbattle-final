<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#062c43;color:white;font-family:Arial,sans-serif;overflow:hidden}
button{min-width:90px;min-height:46px;border:0;border-radius:13px;padding:10px 14px;font-weight:bold;font-size:15px}
#menu{height:100vh;overflow:auto;padding:12px;text-align:center;background:linear-gradient(#06324c,#087e9e)}
.card{background:#06283ddd;border-radius:16px;padding:12px;margin:9px 0}
input{width:100%;padding:12px;border:0;border-radius:10px;font-size:16px;margin:5px 0}
#fish{font-size:120px;height:145px;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.small{font-size:12px;opacity:.8}
#game{display:none;position:fixed;inset:0;width:100%;height:100%}
#hud{display:none;position:fixed;top:7px;left:7px;right:7px;z-index:4;gap:6px;flex-wrap:wrap}
.h{background:#06283de8;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:bold}
.ctrl{display:none;position:fixed;z-index:5;border-radius:50%;width:82px;height:82px}
#attack{right:16px;bottom:16px;background:#ffd34e}#skill{right:16px;bottom:112px;background:#d69aff}#run{right:112px;bottom:16px;background:#76e6ff}
#joy{display:none;position:fixed;z-index:5;left:16px;bottom:16px;width:122px;height:122px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55}
#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ffffffaa}
#modal{display:none;position:fixed;z-index:20;left:7%;right:7%;top:8%;bottom:8%;overflow:auto;background:#06283cf8;border-radius:18px;padding:16px}
#toast{display:none;position:fixed;z-index:50;left:50%;top:15%;transform:translateX(-50%);padding:12px 16px;background:#061f32f5;border-radius:13px;font-weight:bold}
</style>
</head>
<body>
<div id="menu">
<h1>🐟 뻐끔뻐끔 배틀</h1>
<div class="small">처음에는 기본 물고기 1마리만 사용할 수 있어.</div>
<div id="fish">🐟</div><h2 id="fishName">기본 물고기</h2><div id="stats"></div>
<div class="card">
<b>👤 닉네임</b><input id="nick" maxlength="12" placeholder="닉네임"><button id="nickBtn">저장</button>
</div>
<div class="card"><b>🌊 동해 초기 물고기</b><p>⭐ 악마의 불가사리로 시작해.</p></div><div class="card"><div class="row"><button id="stageBtn">🌊 지역 옮기기</button><button id="battleBtn">⚔️ 대결</button><button id="leaderBtn">👑 리더 인증</button><button id="accountBtn">🔑 계정 연동</button></div>
</div>
<div class="card"><b>🐠 물고기 수집</b><p class="small">맵에서 물고기를 먹으면 해당 물고기 수집 수가 1마리 올라가. 필요한 개수까지 채우면 그 물고기가 해제돼.</p><div id="fishList" class="row"></div></div>
<div class="card"><b>👥 동료 5마리</b><div id="team"></div></div>
<button id="start" style="background:#ffd34e">⚔️ 전투 시작</button>
</div>

<canvas id="game"></canvas>
<div id="hud"><span class="h" id="wave"></span><span class="h" id="hp"></span><span class="h" id="level"></span><span class="h" id="coin"></span><span class="h" id="skillState"></span></div>
<div id="joy"><div id="stick"></div></div>
<button class="ctrl" id="run">💨<br>달리기</button>
<button class="ctrl" id="skill">✨<br>스킬</button>
<button class="ctrl" id="attack">⚔️<br>공격</button>
<div id="modal"></div><div id="toast"></div>

<script>
"use strict";
const LEADER_CODE="50974266";
const ACCOUNT_LINK_CODE=Math.floor(10000000+Math.random()*90000000).toString();
const fish=[
["⭐","악마의 불가사리",12,110],["🐡","복어",16,125],["🐟","멸치",10,90],
["🐠","산호 물고기",14,120],["🦈","상어",25,180],["🐙","문어",30,210],
["🪼","해파리",34,230],["🐢","바다거북",39,260],["🐋","전설 고래",48,320],
["🐉","해룡",62,390],["🦑","심해 오징어",72,440],["🐬","돌고래",78,470]
];
const stages=[
["동해",80,[0,1,2,3,4]],["지중해",100,[1,2,4,5]],["북해",150,[3,5,6,7]],
["카리브해",200,[2,4,7,8]],["태평양",300,[6,7,8,9,10,11]],["???해",500,[8,9,10,11]]
];
const fishUnlockNeed=[1,5,10,15,20,25,30,35,40,45,50,55];
const mapCollected=Array(fish.length).fill(0);
let state={nick:"플레이어",sel:0,unlocked:1,coins:50,lv:1,xp:0,growth:1,lastFree:"",draws:0,stage:0,cleared:0,link:ACCOUNT_LINK_CODE,fishCount:Array(fish.length).fill(0)};
try{const s=JSON.parse(localStorage.getItem("PBB_FINAL"));if(s)state={...state,...s}}catch(e){}
if(!state.link)state.link=ACCOUNT_LINK_CODE;
if(!Array.isArray(state.fishCount))state.fishCount=Array(fish.length).fill(0);
while(state.fishCount.length<fish.length)state.fishCount.push(0);
let running=false,player=null,enemies=[],allies=[],wave=1,time=20,skillCd=0,attackCd=0,attackAnim=0,run=false,moveX=0,moveY=0,saveT=0,pickups=[],pickupT=0;
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();
function save(){state.fishCount=state.fishCount.slice(0,fish.length);localStorage.setItem("PBB_FINAL",JSON.stringify(state))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.toastT);window.toastT=setTimeout(()=>x.style.display="none",1400)}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function render(){
document.getElementById("nick").value=state.nick;document.getElementById("coins").textContent="🪙 "+state.coins;
const f=fish[state.sel];document.getElementById("fish").textContent=f[0];document.getElementById("fishName").textContent=f[1];
document.getElementById("stats").textContent="⚔️ "+Math.round(f[2]*state.growth)+"　❤️ "+Math.round(f[3]*state.growth)+"　⭐ Lv."+state.lv;
const list=document.getElementById("fishList");list.innerHTML="";
fish.forEach((x,i)=>{const b=document.createElement("button");const need=fishUnlockNeed[i]||35;
b.textContent=(i<state.unlocked?x[0]+" "+x[1]:"🔒 "+x[1])+" ("+(state.fishCount[i]||0)+"/"+need+")";b.disabled=i>=state.unlocked;b.onclick=()=>{state.sel=i;save();render()};list.appendChild(b)});
document.getElementById("team").textContent="🐟 🐠 🐡 🐙 🐢";
}
function setNick(){const v=document.getElementById("nick").value.trim();if(!v)return toast("닉네임을 입력해 줘.");state.nick=v;save();toast("닉네임 저장!")}

function openStage(){
const p=document.getElementById("modal");p.style.display="block";
p.innerHTML="<button id='close'>닫기</button><h2>🌊 지역 옮기기</h2>"+stages.map((s,i)=>{
const ok=i<=state.cleared;return "<div class='card'><b>"+(i+1)+". "+s[0]+"</b><br>클리어: "+s[1]+" 웨이브<br><span class='small'>등장: "+s[2].map(x=>fish[x][0]).join(" ")+"</span><br><button "+(ok?"":"disabled")+" data-stage='"+i+"'>"+(ok?"입장":"🔒 잠김")+"</button></div>"
}).join("");
document.getElementById("close").onclick=closeModal;
p.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{state.stage=+b.dataset.stage;save();closeModal();render();toast("🌊 "+stages[state.stage][0]+" 입장")});
}
function openLeader(){
const p=document.getElementById("modal");p.style.display="block";
p.innerHTML="<button id='close'>닫기</button><h2>👑 리더 인증</h2><input id='leaderInput' inputmode='numeric' maxlength='8' placeholder='리더 코드'><button id='verify'>인증하기</button><p class='small'>리더 코드: "+LEADER_CODE+"</p>";
document.getElementById("close").onclick=closeModal;document.getElementById("verify").onclick=()=>{if(document.getElementById("leaderInput").value.replace(/\\D/g,"")===LEADER_CODE){toast("👑 리더 인증 성공!");closeModal()}else toast("❌ 리더 코드가 틀렸어.")};
}
function openAccount(){
const p=document.getElementById("modal");p.style.display="block";
p.innerHTML="<button id='close'>닫기</button><h2>🔗 계정 연동</h2><p>내 계정 연동 번호</p><input readonly value='"+state.link+"'><p class='small'>📸 이 번호를 캡처해 보관해.</p>";
document.getElementById("close").onclick=closeModal;
}
function battle(){
const p=document.getElementById("modal");p.style.display="block";
p.innerHTML="<button id='close'>닫기</button><h2>⚔️ 대결</h2><p>상대 AI와 바로 대결해.</p><button id='fight'>대결 시작</button><div id='result' class='card'>준비 완료</div>";
document.getElementById("close").onclick=closeModal;
document.getElementById("fight").onclick=()=>{
const me=fish[state.sel],opp=fish[Math.floor(Math.random()*state.unlocked)];
const a=me[2]*state.growth+state.lv*3+Math.random()*30,b=opp[2]+Math.random()*30,win=a>=b;
if(win){state.coins+=10;state.xp+=20}else state.coins=Math.max(0,state.coins-2);
save();document.getElementById("result").innerHTML=(win?"🏆 승리!":"💥 패배!")+"<br>내 전투력 "+Math.round(a)+"<br>상대 "+opp[0]+" "+opp[1]+" / "+Math.round(b);toast(win?"🏆 승리!":"💥 패배!");render();
};
}
function beginGame(){
const s=stages[state.stage],f=fish[state.sel];
running=true;wave=1;time=20;skillCd=0;attackCd=0;attackAnim=0;moveX=moveY=0;
player={x:canvas.width/2,y:canvas.height/2,r:24*state.growth,hp:f[3]*state.growth,max:f[3]*state.growth,atk:f[2]*state.growth};
enemies=[];allies=[];pickups=[];pickupT=0;
for(let i=0;i<5;i++)allies.push({x:120+i*80,y:130+(i%2)*100,r:18,fi:stages[state.stage][2][i%stages[state.stage][2].length],hp:100,max:100});
for(let i=0;i<5;i++)spawnEnemy();
document.getElementById("menu").style.display="none";canvas.style.display="block";
document.getElementById("hud").style.display="flex";["joy","attack","skill","run"].forEach(id=>document.getElementById(id).style.display="block");
toast("⚔️ 전투 시작!");
}
function spawnEnemy(){
const side=Math.floor(Math.random()*4);let x=20+Math.random()*(canvas.width-40),y=20+Math.random()*(canvas.height-40);
if(side===0)x=20;if(side===1)x=canvas.width-20;if(side===2)y=20;if(side===3)y=canvas.height-20;
const pool=stages[state.stage][2],fi=pool[Math.floor(Math.random()*pool.length)];
enemies.push({x,y,r:18+Math.random()*6,fi,hp:50+wave*4,max:50+wave*4,atk:7,spd:45+Math.random()*35,tx:Math.random()*canvas.width,ty:Math.random()*canvas.height,think:0});
}
function update(dt){
if(!running)return;
attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);attackAnim=Math.max(0,attackAnim-dt);
const sp=run?300:170;player.x=Math.max(20,Math.min(canvas.width-20,player.x+moveX*sp*dt));player.y=Math.max(20,Math.min(canvas.height-20,player.y+moveY*sp*dt));
time-=dt;if(time<=0){time=20;if(wave<stages[state.stage][1])wave++;else{state.cleared=Math.max(state.cleared,state.stage+1);save();endGame();toast("🏆 지역 클리어! 다음 지역 해제!");return}}
if(enemies.length<14&&Math.random()<dt*.25)spawnEnemy();
pickupT-=dt;
if(pickupT<=0 && pickups.length<8){
 pickupT=1.2;
 const pool=stages[state.stage][2],fi=pool[Math.floor(Math.random()*pool.length)];
 pickups.push({x:30+Math.random()*(canvas.width-60),y:40+Math.random()*(canvas.height-100),fi,r:15});
}
for(let i=pickups.length-1;i>=0;i--){
 const p=pickups[i];
 if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){
   state.fishCount[p.fi]=(state.fishCount[p.fi]||0)+1;
   const need=fishUnlockNeed[p.fi]||35;
   toast("🐟 "+fish[p.fi][1]+" "+state.fishCount[p.fi]+"/"+need);
   if(state.fishCount[p.fi]>=need && p.fi>=state.unlocked){
     state.unlocked=Math.min(fish.length,p.fi+1);
     toast("🎉 "+fish[p.fi][1]+" 해제!");
   }
   pickups.splice(i,1);save();
 }
}
for(const p of pickups){ctx.font="30px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(fish[p.fi][0],p.x,p.y)}
for(const e of enemies){
e.think-=dt;if(e.think<=0){e.think=.8+Math.random()*1.8;e.tx=Math.random()*canvas.width;e.ty=Math.random()*canvas.height}
let target=null,td=999;
if(Math.random()<.25){td=Math.hypot(player.x-e.x,player.y-e.y);if(td<300)target=player}
const tx=target?target.x:e.tx,ty=target?target.y:e.ty,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(target&&td<45)player.hp-=e.atk*dt;
}
if(player.hp<=0){endGame();toast("💫 전투 종료");return}
if(saveT<=0){save();saveT=2}else saveT-=dt;
document.getElementById("wave").textContent="🌊 "+wave+"/"+stages[state.stage][1];
document.getElementById("hp").textContent="❤️ "+Math.ceil(player.hp);
document.getElementById("level").textContent="⭐ Lv."+state.lv;
document.getElementById("coin").textContent="🪙 "+state.coins;
document.getElementById("skillState").textContent=skillCd?"✨ "+skillCd.toFixed(1):"✨ 준비";
}
function attack(){
if(!running||attackCd>0)return;attackCd=.09;attackAnim=.16;
for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<105){e.hp-=player.atk;if(e.hp<=0){state.xp+=10;state.coins++;e.dead=true}}
enemies=enemies.filter(e=>!e.dead);
}
function skill(){
if(!running||skillCd>0)return;skillCd=8;
for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<230){e.hp-=player.atk*4;if(e.hp<=0)e.dead=true}
toast("✨ 스킬 발동!");
}
function endGame(){running=false;["hud","joy","attack","skill","run"].forEach(id=>document.getElementById(id).style.display="none");canvas.style.display="none";document.getElementById("menu").style.display="block";render()}
function closeModal(){document.getElementById("modal").style.display="none"}
document.getElementById("nickBtn").onclick=setNick;
document.getElementById("stageBtn").onclick=openStage;
document.getElementById("battleBtn").onclick=battle;
document.getElementById("leaderBtn").onclick=openLeader;
document.getElementById("accountBtn").onclick=openAccount;
document.getElementById("start").onclick=()=>{const s=stages[state.stage];if(!s[2].includes(state.sel))return toast("❌ 이 지역에서 사용할 수 없는 물고기야.");beginGame()};
document.getElementById("attack").onpointerdown=attack;document.getElementById("skill").onpointerdown=skill;
document.getElementById("run").onpointerdown=()=>run=true;document.getElementById("run").onpointerup=()=>run=false;document.getElementById("run").onpointercancel=()=>run=false;
const joy=document.getElementById("joy"),stick=document.getElementById("stick");let jd=false;
function setJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-61,y=e.clientY-r.top-61,d=Math.hypot(x,y)||1,m=43;if(d>m){x=x/d*m;y=y/d*m}moveX=x/m;moveY=y/m;stick.style.transform="translate("+x+"px,"+y+"px)"}
joy.onpointerdown=e=>{jd=true;joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(jd)setJoy(e)};joy.onpointerup=()=>{jd=false;moveX=moveY=0;stick.style.transform="translate(0,0)"};
function loop(t){const dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
function draw(){
if(!running)return;ctx.clearRect(0,0,canvas.width,canvas.height);
const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,"#052b45");g.addColorStop(1,"#0786a4");ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
for(const e of enemies){
 ctx.font="34px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(fish[e.fi][0],e.x,e.y);
 ctx.fillStyle="#222";ctx.fillRect(e.x-18,e.y-e.r-8,36,4);ctx.fillStyle="#7cff7c";ctx.fillRect(e.x-18,e.y-e.r-8,36*Math.max(0,e.hp/e.max),4);
}
for(const a of allies){ctx.font="34px sans-serif";ctx.textAlign="center";ctx.fillText("🐟",a.x,a.y)}
const f=fish[state.sel],dip=attackAnim>0?Math.sin(attackAnim/.16*Math.PI)*13:0,lung=attackAnim>0?Math.sin(attackAnim/.16*Math.PI)*25:0;
ctx.save();ctx.translate(player.x+lung,player.y+dip);ctx.font=(58*state.growth)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f[0],0,0);ctx.restore();
}
render();requestAnimationFrame(loop);
</script>
</body>
</html>
