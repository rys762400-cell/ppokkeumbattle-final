<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#06324b;color:#fff}
button{border:0;border-radius:12px;padding:11px 14px;margin:4px;font-weight:700;font-size:15px}
input{padding:11px;border-radius:10px;border:0;width:100%;font-size:16px}
#menu{min-height:100vh;padding:14px;text-align:center;background:linear-gradient(#06405d,#078aa2)}
.card{background:#062a40dd;border-radius:16px;padding:13px;margin:9px 0}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
#fishPreview{height:170px;display:flex;align-items:center;justify-content:center}
.fish{width:150px;height:90px;position:relative;filter:drop-shadow(0 0 8px #fff8)}
.body{position:absolute;left:42px;top:20px;width:92px;height:56px;border:5px solid #073047;border-radius:55%;background:#ffb347}
.tail{position:absolute;left:3px;top:21px;border-style:solid;border-width:27px 43px 27px 0;border-color:transparent #ffb347 transparent transparent}
.eye{position:absolute;left:109px;top:34px;width:12px;height:12px;border-radius:50%;background:#073047;box-shadow:0 0 0 4px white}
.small{font-size:12px;opacity:.8}
#game{display:none;position:fixed;inset:0;width:100%;height:100%;background:#0787a5;touch-action:none}
#hud{display:none;position:fixed;top:7px;left:7px;right:7px;z-index:5;gap:5px;flex-wrap:wrap}
.h{background:#06283de8;border-radius:8px;padding:7px;font-size:12px;font-weight:bold}
.ctrl{display:none;position:fixed;z-index:6;width:78px;height:78px;border-radius:50%}
#attack{right:14px;bottom:14px;background:#ffd34e}#skill{right:14px;bottom:105px;background:#d89aff}#run{right:105px;bottom:14px;background:#76e6ff}
#joy{display:block;position:fixed;z-index:9999;left:18px;bottom:22px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.20);border:3px solid rgba(255,255,255,.62);touch-action:none;pointer-events:auto;box-sizing:border-box}
#stick{position:absolute;left:50%;top:50%;margin:-25px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 4px 14px #0009;pointer-events:none;will-change:transform}
#modal{display:none;position:fixed;z-index:20;left:6%;right:6%;top:6%;bottom:6%;overflow:auto;background:#06283cf7;border-radius:18px;padding:15px}
#toast{display:none;position:fixed;z-index:30;top:15%;left:50%;transform:translateX(-50%);background:#061f32f5;border-radius:12px;padding:12px 16px;font-weight:bold}
#duelHud{display:none;position:fixed;z-index:110;top:72px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;background:#071b2dcc;color:#fff;font-weight:700;border:1px solid #ffffff44}
</style>
</head>
<body>
<section id="menu">
<h1>🐟 뻐끔뻐끔 배틀</h1>
<p>동해의 시작 물고기: <b>악마의 불가사리</b></p>
<div id="fishPreview"><div class="fish"><div class="body"></div><div class="tail"></div><div class="eye"></div></div></div>
<h2 id="fishName">악마의 불가사리</h2>
<div id="visualNote" class="card">🐟 실제 생김새를 참고한 입체형 물고기 그래픽 · 🎮 터치 조이스틱</div><div id="stats"></div><div id="ability"></div><div id="best"></div>
<div class="card"><b>👤 닉네임</b><input id="nick" placeholder="닉네임" maxlength="12"><button id="saveNick">저장</button></div>
<div class="card"><div class="row">
<button id="start">⚔️ 전투 시작</button>
<button id="regions">🌊 지역 옮기기</button>
<button id="ai">🍀 운이 좋으면 강화되는 대결</button>
<button id="leader">👑 리더 인증</button><button id="aiEdit" style="display:none">🤖 AI 게임 수정</button>
<button id="account">🔑 계정 연동 번호</button>
<button id="friends">👥 친구 초대</button>
<button id="league">🏆 리그전</button>
<button id="idle">🌙 방치 성장</button>
</div></div>
<div class="card"><b>🐠 물고기 수집·해제</b><p class="small">총 50마리 수집부터 공격력 2배! 이후 50마리마다 공격력 +1. (100마리=2배 +2, 150마리=2배 +3)</p><p class="small">맵에서 물고기를 먹으면 수집 수가 1 올라가고 필요한 수를 채우면 해제돼.</p><div id="fishList" class="row"></div></div>
<div class="card">🪙 코인: <b id="coins">50</b>　🏆 최고 점수: <b id="best2">0</b></div>
</section>

<canvas id="game"></canvas>
<div id="hud"><span class="h" id="wave"></span><span class="h" id="hp"></span><span class="h" id="lv"></span><span class="h" id="gcoins"></span><span class="h" id="score"></span><span class="h" id="cool"></span></div>
<div id="joy"><div id="stick"></div></div>
<button class="ctrl" id="attack">⚔️<br>공격</button>
<button class="ctrl" id="skill">✨<br>스킬</button>
<button class="ctrl" id="run">💨<br>달리기</button>
<div id="modal"></div><div id="toast"></div>

<script>
"use strict";
const fish=[
["⭐","악마의 불가사리",12,110],["🐡","복어",16,125],["🐟","멸치",10,90],["🐠","산호 물고기",14,120],
["🦈","상어",25,180],["🐙","문어",30,210],["🪼","해파리",34,230],["🐢","바다거북",39,260],
["🐋","전설 고래",48,320],["🐉","해룡",62,390],["🦑","심해 오징어",72,440],["🐬","돌고래",78,470]];
const need=[1,5,10,15,20,25,30,35,40,45,50,55];

const abilities=[
 {skill:"강력 물어뜯기",passive:"단단한 몸",desc:"짧은 범위에 강한 피해. 받는 피해 8% 감소."},
 {skill:"마취독",passive:"독가시",desc:"적을 중독시켜 잠시 느리게 한다. 공격 적중 시 추가 피해."},
 {skill:"돌진",passive:"민첩한 몸",desc:"빠르게 돌진하며 부딪힌 적을 밀어낸다. 이동 속도 12% 증가."},
 {skill:"산호 폭발",passive:"산호 보호",desc:"주변에 파동 피해. 버블 회복량 +10%."},
 {skill:"상어 돌격",passive:"포식자",desc:"앞쪽 적에게 큰 피해. 적 처치 시 HP 5% 회복."},
 {skill:"먹물 폭발",passive:"먹물 위장",desc:"주변 적의 이동을 크게 늦춘다. 적 공격력 8% 감소."},
 {skill:"전기 충격",passive:"전기 피부",desc:"주변 여러 적에게 연쇄 피해. 피격 시 15% 확률 반격."},
 {skill:"껍질 방패",passive:"단단한 등껍질",desc:"잠시 피해를 크게 감소. 최대 HP 12% 증가."},
 {skill:"고래 충격파",passive:"거대한 체력",desc:"넓은 범위의 강력한 충격파. 최대 HP 20% 증가."},
 {skill:"해룡의 불꽃",passive:"용의 비늘",desc:"강력한 광역 공격. 공격력 15% 증가."},
 {skill:"심해 포식",passive:"어둠 적응",desc:"적 하나를 집중 공격하고 회복. 스킬 적중 시 HP 12% 회복."},
 {skill:"파도 질주",passive:"돌고래의 속도",desc:"빠르게 연속 공격. 이동 속도 25% 증가."}
];

const regions=[
["동해",80,[0,1,2,3,4]],["지중해",100,[1,2,4,5]],["북해",150,[3,5,6,7]],
["카리브해",200,[2,4,7,8]],["태평양",300,[6,7,8,9,10,11]],["???해",500,[8,9,10,11]]];
const KEY="PBB_NEW_GAME_V1";
function getCode(){let c=localStorage.getItem("PBB_ACCOUNT");if(!/^\d{8}$/.test(c||"")){c=String(Math.floor(10000000+Math.random()*90000000));localStorage.setItem("PBB_ACCOUNT",c)}return c}
let state={nick:"플레이어",sel:0,unlocked:1,coins:50,lv:1,xp:0,growth:1,stage:0,cleared:0,score:0,best:0,aiBonus:0,idlePower:0,lastSeen:Date.now(),account:getCode(),counts:Array(fish.length).fill(0),friends:[],leader:false,aiEdits:[]};
try{let s=JSON.parse(localStorage.getItem(KEY));if(s)state={...state,...s}}catch(e){}
if(!Array.isArray(state.counts))state.counts=Array(fish.length).fill(0);if(typeof state.leader!=="boolean")state.leader=false;if(!Array.isArray(state.aiEdits))state.aiEdits=[];
while(state.counts.length<fish.length)state.counts.push(0);
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d");
let running=false,player=null,enemies=[],pickups=[],wave=1,time=20,atkCd=0,skillCd=0,moveX=0,moveY=0,fast=false,last=0,skillBuff=0;
function save(){state.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}

function totalFishCollected(){return state.counts.reduce((a,b)=>a+(Number(b)||0),0)}
function collectionAttackMultiplier(){
 const total=totalFishCollected();
 return total>=50 ? 2 : 1;
}
function collectionAttackBonus(){
 const total=totalFishCollected();
 return Math.floor(total/50);
}

function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.toastT);window.toastT=setTimeout(()=>$("toast").style.display="none",1400)}
function sound(a,b,d){try{let c=window.ac||(window.ac=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.055;o.frequency.value=a;o.frequency.exponentialRampToValueAtTime(b,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}

function drawWaterCaustics(){
  ctx.save();ctx.globalAlpha=.08;ctx.strokeStyle="#bff9ff";ctx.lineWidth=2;
  const t=performance.now()/900;
  for(let i=0;i<9;i++){let x=(i*157+t*18)%canvas.width;ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+35,canvas.height*.3,x-45,canvas.height*.65,x+20,canvas.height);ctx.stroke()}
  ctx.restore();
}
function render(){drawWaterCaustics();
 if(state.sel>=state.unlocked)state.sel=0;
 $("nick").value=state.nick;$("fishName").textContent=fish[state.sel][1];
 $("stats").textContent="⚔️ 공격 "+Math.round((fish[state.sel][2]*state.growth+state.aiBonus+state.idlePower)*collectionAttackMultiplier()+collectionAttackBonus())+"　❤️ HP "+Math.round(fish[state.sel][3]*state.growth)+"　⭐ Lv."+state.lv+"　🐟 총 "+totalFishCollected()+"마리"; $("ability").textContent="✨ 액티브: "+abilities[state.sel].skill+"　🛡️ 패시브: "+abilities[state.sel].passive+"\n"+abilities[state.sel].desc;
 $("best").textContent="🏆 최고 점수 "+state.best+"점";$("coins").textContent=state.coins;$("best2").textContent=state.best;
 $("fishList").innerHTML="";
 fish.forEach((f,i)=>{let b=document.createElement("button");b.textContent=(i<state.unlocked?f[0]+" "+f[1]:"🔒 "+f[1])+" "+state.counts[i]+"/"+need[i];b.disabled=i>=state.unlocked;b.onclick=()=>{state.sel=i;save();render()};$("fishList").appendChild(b)})
}
function modal(html){$("modal").innerHTML=html;$("modal").style.display="block"}
function close(){ $("modal").style.display="none" }
function showRegions(){modal("<button id='x'>닫기</button><h2>🌊 지역</h2><p class='small'>혼자 클리어해도 다음 지역이 열려. 친구와 팀으로 클리어해도 똑같이 열려.</p>"+regions.map((r,i)=>"<div class='card'><b>"+(i+1)+". "+r[0]+"</b><br>"+r[1]+" 웨이브<br><button data-r='"+i+"' "+(i<=state.cleared?"":"disabled")+">"+(i<=state.cleared?"입장":"🔒 잠김")+"</button></div>").join(""));$("x").onclick=close;$("modal").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.stage=+b.dataset.r;save();close();render()})}
function showLeader(){modal("<button id='x'>닫기</button><h2>👑 리더 인증</h2><p class='small'>리더 코드를 입력해.</p><input id='lc' inputmode='numeric' maxlength='8' placeholder='8자리 코드'><button id='ok'>인증하기</button>");$("x").onclick=close;$("ok").onclick=()=>{if($("lc").value==="50974266"){state.leader=true;save();$("aiEdit").style.display="inline-block";toast("👑 리더 인증 성공!");close()}else toast("❌ 리더 코드가 틀렸어.")}}

function showAIEditor(){
 if(!state.leader){toast("❌ 리더 인증이 필요해.");return}
 modal("<button id='x'>닫기</button><h2>🤖 AI 게임 수정</h2>"+
 "<p class='small'>게임을 조금씩 바꾸는 요청을 입력해. 안전한 범위에서 한 번에 하나씩 적용돼.</p>"+
 "<input id='req' maxlength='100' placeholder='예: 적을 조금 더 강하게 해줘'>"+
 "<button id='apply'>🤖 수정 적용</button><div id='editResult' class='card'>현재 수정 "+state.aiEdits.length+"회</div>"+
 "<div class='small'>지원 예: 적 강하게/약하게, 물고기 등장 증가/감소, 웨이브 시간 증가/감소, 점수 증가/감소, 이동 속도 증가/감소</div>");
 $("x").onclick=close;
 $("apply").onclick=()=>{
   const q=$("req").value.trim();
   if(!q){toast("수정할 내용을 입력해 줘.");return}
   let applied=[];
   if(/적.*(강|세|어렵)/.test(q)){state.aiEnemyPower=(state.aiEnemyPower||1)*1.05;applied.push("적 난이도 +5%")}
   if(/적.*(약|쉬|쉽)/.test(q)){state.aiEnemyPower=(state.aiEnemyPower||1)*.95;applied.push("적 난이도 -5%")}
   if(/물고기.*(많|증가|자주)/.test(q)){state.aiFishRate=(state.aiFishRate||1)*1.1;applied.push("물고기 등장 +10%")}
   if(/물고기.*(적|감소)/.test(q)){state.aiFishRate=(state.aiFishRate||1)*.9;applied.push("물고기 등장 -10%")}
   if(/웨이브.*(길|증가|느리)/.test(q)){state.aiWaveTime=(state.aiWaveTime||20)+2;applied.push("웨이브 시간 +2초")}
   if(/웨이브.*(짧|감소|빠르)/.test(q)){state.aiWaveTime=Math.max(5,(state.aiWaveTime||20)-2);applied.push("웨이브 시간 -2초")}
   if(/점수.*(많|증가)/.test(q)){state.aiScoreRate=(state.aiScoreRate||1)*1.1;applied.push("점수 +10%")}
   if(/점수.*(적|감소)/.test(q)){state.aiScoreRate=(state.aiScoreRate||1)*.9;applied.push("점수 -10%")}
   if(/이동.*(빠|증가)/.test(q)){state.aiMoveRate=(state.aiMoveRate||1)*1.1;applied.push("이동 속도 +10%")}
   if(/이동.*(느|감소)/.test(q)){state.aiMoveRate=Math.max(.4,(state.aiMoveRate||1)*.9);applied.push("이동 속도 -10%")}
   if(!applied.length)applied.push("요청을 이해하지 못했어. 예시 문장을 사용해 줘.");
   else state.aiEdits.push({time:new Date().toLocaleString(),request:q,result:applied.join(", ")});
   save();render();
   $("editResult").innerHTML=applied.join("<br>")+"<br><span class='small'>누적 수정: "+state.aiEdits.length+"회</span>";
   toast(applied.length?"🤖 수정 완료!":"");
 };
}

function showAccount(){modal("<button id='x'>닫기</button><h2>🔑 계정 연동 번호</h2><p>내 번호</p><input readonly value='"+state.account+"'><p class='small'>사람마다 무작위로 만들어지고 이 기기에 저장돼.</p>");$("x").onclick=close}
function showFriends(){let code=localStorage.getItem("PBB_FRIEND")||String(Math.floor(100000+Math.random()*900000));localStorage.setItem("PBB_FRIEND",code);let link=location.href.split("#")[0]+"#friend="+code;modal("<button id='x'>닫기</button><h2>👥 친구 초대</h2><p>친구 코드: <b>"+code+"</b></p><input readonly value='"+link+"'><button id='copy'>📋 링크 복사</button><button id='accept'>✅ 친구 수락</button>");$("x").onclick=close;$("copy").onclick=()=>{navigator.clipboard?.writeText(link);toast("📋 링크 복사 완료")};$("accept").onclick=()=>{if(!state.friends.includes("친구"))state.friends.push("친구");save();toast("👥 친구 수락 완료")}}
function showLeague(){if(!state.friends.length){toast("👥 먼저 친구를 추가해 줘.");return}let rows=[{n:state.nick,s:state.best},...state.friends.map((n,i)=>({n:"친구 "+(i+1),s:Math.max(0,state.best-20+i*7)}))].sort((a,b)=>b.s-a.s);modal("<button id='x'>닫기</button><h2>🏆 리그전</h2>"+rows.map((r,i)=>"<div class='card'>"+(i+1)+"위　<b>"+r.n+"</b>　"+r.s+"점</div>").join("")+"<button id='fight'>⚔️ 리그전 대결</button><div id='result'></div>");$("x").onclick=close;$("fight").onclick=()=>{let opp=50+Math.floor(Math.random()*300),me=state.score+Math.floor(Math.random()*100),win=me>=opp;if(win)state.score+=50;if(state.score>state.best)state.best=state.score;save();$("result").innerHTML=(win?"🏆 승리!":"💥 패배!")+"<br>내 점수 "+me+" / 상대 "+opp+"<br>최고 점수 "+state.best;render()}}
function aiBattle(){modal("<button id='x'>닫기</button><h2>🍀 운이 좋으면 강화되는 대결</h2><p>승리하면 공격력 +0.5, 패배하면 공격력 -0.5</p><button id='f'>대결 시작</button><div id='r' class='card'></div>");$("x").onclick=close;$("f").onclick=()=>{let me=fish[state.sel],op=fish[Math.floor(Math.random()*state.unlocked)],a=me[2]*state.growth+state.lv*3+state.aiBonus+state.idlePower+Math.random()*30,b=op[2]+Math.random()*30,win=a>=b;state.aiBonus=win?state.aiBonus+.5:Math.max(-10,state.aiBonus-.5);if(win)state.coins+=10;else state.coins=Math.max(0,state.coins-2);save();$("r").innerHTML=win?"🏆 승리! 공격력 +0.5":"💥 패배! 공격력 -0.5";render()}}
function idle(){let c=Math.min(144,Math.floor((Date.now()-state.lastSeen)/18000000));if(c){state.idlePower+=c;state.coins+=c*5;state.xp+=c*10;while(state.xp>=100){state.xp-=100;state.lv++;state.growth+=.03}save();toast("🌙 방치 성장 +"+c)}else toast("🌙 아직 5시간이 지나지 않았어.");render()}
function start(){regionFishIndex=0;let pool=regions[state.stage][2];if(!pool.includes(state.sel)){toast("❌ 이 지역에서 이 물고기는 사용할 수 없어.");return}running=true;wave=1;time=state.aiWaveTime||20;atkCd=0;skillCd=0;moveX=moveY=0;const ab=abilities[state.sel];
let passiveHp=1,passiveAtk=1,passiveSpeed=1;
if(state.sel===7)passiveHp=1.12;
if(state.sel===8)passiveHp=1.20;
if(state.sel===9)passiveAtk=1.15;
if(state.sel===11)passiveSpeed=1.25;
if(state.sel===2)passiveSpeed=1.12;
player={x:innerWidth/2,y:innerHeight/2,r:28,hp:fish[state.sel][3]*state.growth*passiveHp,max:fish[state.sel][3]*state.growth*passiveHp,atk:((fish[state.sel][2]*state.growth+state.aiBonus+state.idlePower)*collectionAttackMultiplier()+collectionAttackBonus())*passiveAtk,speed:passiveSpeed};enemies=[];pickups=[];for(let i=0;i<7;i++)spawn();$("menu").style.display="none";canvas.style.display="block";$("hud").style.display="flex";["joy","attack","skill","run"].forEach(id=>$(id).style.display="block");resize();toast("⚔️ 전투 시작!")}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
let regionFishIndex=0;
function nextRegionFish(){
 const p=regions[state.stage][2];
 const fi=p[regionFishIndex%p.length]; regionFishIndex++;
 return fi;
}
function spawn(){
 const fi=nextRegionFish();
 const difficulty=1+state.stage*0.14+Math.floor(wave/25)*0.04;
 const hp=(45+wave*4)*difficulty;
 enemies.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:18+state.stage*.7,fi,
 hp:hp,max:hp,s:(45+Math.random()*55)*difficulty,tx:Math.random()*canvas.width,ty:Math.random()*canvas.height,t:0});
}

function startDuel(){
 if(running){toast("먼저 현재 전투를 끝내 줘.");return}
 running=true;wave=1;time=120;atkCd=0;skillCd=0;skillBuff=0;enemies=[];pickups=[];
 const s=state.sel;
 const ab=abilities[s]||{};
 player={x:innerWidth*.28,y:innerHeight/2,r:30,hp:fish[s][3]*state.growth,max:fish[s][3]*state.growth,atk:((fish[s][2]*state.growth+state.aiBonus+state.idlePower)*collectionAttackMultiplier()+collectionAttackBonus()),speed:1};
 const oppIndex=(s+3)%fish.length;
 window.duel={active:true,oppIndex,opp:{x:innerWidth*.72,y:innerHeight/2,r:30,hp:fish[oppIndex][3]*state.growth,max:fish[oppIndex][3]*state.growth,atk:fish[oppIndex][2]*state.growth,speed:.9,cool:0,skill:5},score:0,oppScore:0};
 $("menu").style.display="none";$("game").style.display="block";$("joy").style.display="block";$("duelHud").style.display="block";toast("⚔️ 1:1 대전 시작!");
}
function duelUpdate(dt){
 if(!window.duel||!window.duel.active)return;
 const d=window.duel,o=d.opp;
 const dx=player.x-o.x,dy=player.y-o.y,dist=Math.hypot(dx,dy)||1;
 // Simple opponent AI: approach, circle, and attack only when close.
 const targetX=player.x+Math.cos(performance.now()/900)*90;
 const targetY=player.y+Math.sin(performance.now()/900)*90;
 const tx=targetX-o.x,ty=targetY-o.y,td=Math.hypot(tx,ty)||1;
 o.x+=tx/td*o.speed*100*dt;o.y+=ty/td*o.speed*100*dt;
 o.x=Math.max(30,Math.min(canvas.width-30,o.x));o.y=Math.max(30,Math.min(canvas.height-30,o.y));
 o.cool-=dt;
 if(dist<85&&o.cool<=0){
   o.cool=1.0;
   player.hp-=o.atk;
   d.oppScore+=10;
   sound(120,70,.08);
 }
 if(dist<105&&atkCd<=0){
   o.hp-=player.atk;
   atkCd=.55;
   d.score+=10;
   sound(180,110,.06);
 }
 if(o.skill>0)o.skill-=dt;
 if(o.skill<=0&&dist<220){
   o.skill=5;
   player.hp-=o.atk*2.2;
   toast("💥 상대 AI 스킬!");
 }
 if(player.hp<=0||o.hp<=0){
   const win=player.hp>0;
   if(win){state.score+=50;state.best=Math.max(state.best,state.score);toast("🏆 대전 승리! +50점")}
   else toast("💀 대전 패배!");
   state.best=Math.max(state.best,state.score);save();
   window.duel.active=false;running=false;
   $("game").style.display="none";$("joy").style.display="none";$("duelHud").style.display="none";$("menu").style.display="block";
 }
}

function update(dt){if(!running)return;
 duelUpdate(dt);skillBuff=Math.max(0,skillBuff-dt);atkCd=Math.max(0,atkCd-dt);skillCd=Math.max(0,skillCd-dt);player.x=Math.max(20,Math.min(canvas.width-20,player.x+moveX*(fast?300:180)*(state.aiMoveRate||1)*player.speed*dt));player.y=Math.max(20,Math.min(canvas.height-20,player.y+moveY*(fast?300:180)*(state.aiMoveRate||1)*player.speed*dt));time-=dt;if(time<=0){time=20;if(wave<regions[state.stage][1])wave++;else{state.cleared=Math.max(state.cleared,state.stage+1);save();end();toast("🏆 지역 클리어!");return}}const difficulty=1+state.stage*0.14+Math.floor(wave/25)*0.04;if(enemies.length<Math.min(14+state.stage*2,24)&&Math.random()<dt*(.3+difficulty*.03))spawn();if(Math.random()<dt*.9*(state.aiFishRate||1)&&pickups.length<8){let fi=nextRegionFish();pickups.push({x:30+Math.random()*(canvas.width-60),y:50+Math.random()*(canvas.height-100),fi,r:15,bubble:true}); if(Math.random()<0.55){fi=nextRegionFish();pickups.push({x:30+Math.random()*(canvas.width-60),y:50+Math.random()*(canvas.height-100),fi,r:15,bubble:false})}}
for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){if(p.bubble === true){
  const before=player.hp;
  player.hp=Math.min(player.max,player.hp+30*(state.sel===3?1.1:1));
  const heal=Math.round(player.hp-before);
  state.score+=5*(state.aiScoreRate||1);
  if(state.score>state.best)state.best=state.score;
  sound(500,900,.12);
  toast("🫧 뿍! ❤️ HP +"+heal);
  pickups.splice(i,1);
  save();
  continue;
}else{
  state.counts[p.fi]++;
  state.score+=10*(state.aiScoreRate||1);
  if(state.score>state.best)state.best=state.score;
  sound(500,900,.08);
  toast("🐟 "+fish[p.fi][1]+" +10점 "+state.counts[p.fi]+"/"+need[p.fi]);
  if(state.counts[p.fi]>=need[p.fi]&&p.fi>=state.unlocked){state.unlocked=Math.min(fish.length,p.fi+1);toast("🎉 "+fish[p.fi][1]+" 해제!")}
}if(state.counts[p.fi]>=need[p.fi]&&p.fi>=state.unlocked){state.unlocked=Math.min(fish.length,p.fi+1);toast("🎉 "+fish[p.fi][1]+" 해제!")}pickups.splice(i,1);save()}}
for(let e of enemies){if(e.poison>0){e.poison-=dt;e.hp-=player.atk*.25*dt}e.t-=dt;if(e.t<=0){e.t=1+Math.random()*2;e.tx=Math.random()*canvas.width;e.ty=Math.random()*canvas.height}let dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<42){let dmg=(7+state.stage*1.2)*difficulty*dt;if(state.sel===0)dmg*=.92;if(state.sel===5)dmg*=.92;if(skillBuff>0)dmg*=.25;player.hp-=dmg}}if(player.hp<=0){end();toast("💫 전투 종료")}}
function attack(){if(!running||atkCd>0)return;atkCd=.1;sound(170,70,.12);for(let e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<115){e.hp-=player.atk;if(e.hp<=0){state.score+=20*(state.aiScoreRate||1);if(state.score>state.best)state.best=state.score;e.dead=true;sound(130,60,.14)}}enemies=enemies.filter(e=>!e.dead);save()}
function skill(){
 if(!running||skillCd>0)return;
 skillCd=8;sound(500,1100,.18);
 const s=state.sel;
 if(s===0){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<105)e.hp-=player.atk*6;toast("💥 강력 물어뜯기!")}
 else if(s===1){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<180){e.hp-=player.atk*2;e.t=0;e.s*=.45;e.poison=4}toast("☠️ 마취독!")}
 else if(s===2){player.x+=moveX*180;player.y+=moveY*180;for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<90)e.hp-=player.atk*4;toast("💨 돌진!")}
 else if(s===3){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<200)e.hp-=player.atk*3;toast("🪸 산호 폭발!")}
 else if(s===4){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<140)e.hp-=player.atk*7;player.hp=Math.min(player.max,player.hp+player.max*.05);toast("🦈 상어 돌격!")}
 else if(s===5){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<220){e.hp-=player.atk*2;e.s*=.35}toast("🖤 먹물 폭발!")}
 else if(s===6){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<210)e.hp-=player.atk*3;toast("⚡ 전기 충격!")}
 else if(s===7){skillBuff=3;toast("🛡️ 껍질 방패!")}
 else if(s===8){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<270)e.hp-=player.atk*5;toast("🌊 고래 충격파!")}
 else if(s===9){for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<240)e.hp-=player.atk*6;toast("🐉 해룡의 불꽃!")}
 else if(s===10){let e=enemies[0];if(e){e.hp-=player.atk*8;player.hp=Math.min(player.max,player.hp+player.max*.12)}toast("🌑 심해 포식!")}
 else {for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<170)e.hp-=player.atk*3;player.x+=moveX*80;player.y+=moveY*80;toast("🐬 파도 질주!")}
 enemies=enemies.filter(e=>e.hp>0);
}
function end(){running=false;["hud","joy","attack","skill","run"].forEach(id=>$(id).style.display="none");canvas.style.display="none";$("menu").style.display="block";render()}
function drawFish(x,y,r,c,fi=state.sel){
  ctx.save();ctx.translate(x,y);
  // Soft underwater shadow
  ctx.globalAlpha=.22;ctx.fillStyle="#00121d";ctx.filter="blur(3px)";
  ctx.beginPath();ctx.ellipse(0,r*.62,r*1.15,r*.22,0,0,Math.PI*2);ctx.fill();ctx.filter="none";ctx.globalAlpha=1;

  const light=ctx.createRadialGradient(-r*.34,-r*.38,r*.04,r*.08,r*.04,r*1.35);
  light.addColorStop(0,"#ffffff");light.addColorStop(.12,"#eafcff");light.addColorStop(.24,c);light.addColorStop(.72,c);light.addColorStop(1,"#061521");
  ctx.fillStyle=light;ctx.strokeStyle="#03131d";ctx.lineWidth=Math.max(1.5,r*.045);

  function body(){
    ctx.beginPath();ctx.ellipse(0,0,r,r*.56,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*.72,0);ctx.lineTo(-r*1.45,-r*.58);ctx.lineTo(-r*1.45,r*.58);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*.08,-r*.4);ctx.lineTo(r*.15,-r*.86);ctx.lineTo(r*.35,-r*.3);ctx.closePath();ctx.fill();ctx.stroke();
  }
  if(fi===0){
    ctx.fillStyle=light;ctx.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
    ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.strokeStyle="#ffffff55";ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2);ctx.lineTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72);ctx.stroke()}
  }else if(fi===1){
    ctx.beginPath();ctx.arc(0,0,r*.8,0,Math.PI*2);ctx.fill();ctx.stroke();
    for(let i=0;i<18;i++){const a=i*Math.PI/9;ctx.strokeStyle="#173342";ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.72,Math.sin(a)*r*.7);ctx.lineTo(Math.cos(a)*r*1.12,Math.sin(a)*r*1.08);ctx.stroke()}
  }else if(fi===4){
    body();ctx.fillStyle="#ffffff22";ctx.beginPath();ctx.ellipse(-r*.15,-r*.12,r*.65,r*.18,-.15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#ffffff66";ctx.lineWidth=r*.025;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(r*(.08+i*.1),r*.16);ctx.lineTo(r*(.13+i*.1),r*.32);ctx.stroke()}
  }else if(fi===5){
    ctx.beginPath();ctx.ellipse(0,-r*.2,r*.62,r*.72,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*r*.14,r*.34);ctx.bezierCurveTo(i*r*.3,r*.65,i*r*.12,r*1.02,i*r*.42,r*.8);ctx.stroke()}
  }else if(fi===6){
    ctx.beginPath();ctx.arc(0,0,r*.72,Math.PI,0);ctx.quadraticCurveTo(r*.66,r*.52,r*.32,r*.25);ctx.quadraticCurveTo(0,r*.58,-r*.32,r*.25);ctx.quadraticCurveTo(-r*.66,r*.52,-r*.72,0);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.22,r*.22);ctx.quadraticCurveTo(i*r*.3,r*.7,i*r*.18,r*1.04);ctx.stroke()}
  }else if(fi===7){
    ctx.beginPath();ctx.ellipse(0,0,r*.9,r*.64,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle="#7ba27699";ctx.lineWidth=r*.035;
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*r*.4,-r*.5);ctx.lineTo(i*r*.4,r*.5);ctx.stroke()}
    for(let a=0;a<Math.PI*2;a+=Math.PI/3){ctx.beginPath();ctx.arc(0,0,r*.42,a,a+.75);ctx.stroke()}
  }else if(fi===8){
    ctx.beginPath();ctx.ellipse(0,0,r*1.32,r*.6,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*1.05,0);ctx.lineTo(-r*1.72,-r*.5);ctx.lineTo(-r*1.5,0);ctx.lineTo(-r*1.72,r*.5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#ffffff35";ctx.beginPath();ctx.ellipse(-r*.2,-r*.22,r*.72,r*.14,-.1,0,Math.PI*2);ctx.fill()
  }else if(fi===9){
    body();ctx.beginPath();ctx.moveTo(-r*.22,-r*.4);ctx.lineTo(0,-r*1.02);ctx.lineTo(r*.22,-r*.35);ctx.closePath();ctx.fill();ctx.stroke()
  }else if(fi===10){
    ctx.beginPath();ctx.ellipse(0,-r*.18,r*.56,r*.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*r*.13,r*.4);ctx.bezierCurveTo(i*r*.25,r*.75,i*r*.18,r*1.03,i*r*.42,r*.8);ctx.stroke()}
  }else if(fi===11){
    body();ctx.beginPath();ctx.moveTo(0,-r*.34);ctx.lineTo(r*.24,-r*.84);ctx.lineTo(r*.4,-r*.25);ctx.closePath();ctx.fill();ctx.stroke()
  }else body();

  // Realistic facial lighting and surface details
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(r*.46,-r*.17,r*.145,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#06131c";ctx.beginPath();ctx.arc(r*.49,-r*.17,r*.067,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(r*.515,-r*.195,r*.022,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle="#ffffff55";ctx.lineWidth=Math.max(1,r*.025);ctx.beginPath();ctx.moveTo(-r*.45,-r*.22);ctx.quadraticCurveTo(-r*.05,-r*.45,r*.2,-r*.18);ctx.stroke();
  ctx.strokeStyle="#071c29aa";ctx.lineWidth=Math.max(1,r*.02);
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*r*.24,r*.04,r*.22,.45,2.45);ctx.stroke()}
  ctx.restore();
}
function draw(){if(!running)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#0787a5";ctx.fillRect(0,0,canvas.width,canvas.height);for(let p of pickups){
 if(p.bubble){
  ctx.beginPath();ctx.fillStyle="#ffffff22";ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#d8fbff";ctx.lineWidth=3;ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2);ctx.stroke();
  drawFish(p.x,p.y,9,fishColor(p.fi));
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(p.x-5,p.y-7,3,0,Math.PI*2);ctx.fill();
 }else drawFish(p.x,p.y,11,fishColor(p.fi),p.fi)
}for(let e of enemies){drawFish(e.x,e.y,e.r,fishColor(e.fi),e.fi);ctx.fillStyle="#222";ctx.fillRect(e.x-18,e.y-e.r-8,36,4);ctx.fillStyle="#7cff7c";ctx.fillRect(e.x-18,e.y-e.r-8,36*Math.max(0,e.hp/e.max),4)}drawFish(player.x,player.y,30,fishColor(state.sel),state.sel);
 if(window.duel&&window.duel.active){
   const o=window.duel.opp;
   drawFish(o.x,o.y,o.r,fishColor(window.duel.oppIndex),window.duel.oppIndex);
   ctx.fillStyle="#ff3344";ctx.fillRect(o.x-34,o.y-o.r-14,68,6);
   ctx.fillStyle="#44e060";ctx.fillRect(o.x-34,o.y-o.r-14,68*Math.max(0,o.hp/o.max),6);
   ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
   ctx.fillText("AI",o.x,o.y-o.r-20);
 };$("wave").textContent="🌊 "+wave+"/"+regions[state.stage][1];$("hp").textContent="❤️ "+Math.ceil(player.hp);$("lv").textContent="⭐ Lv."+state.lv;$("gcoins").textContent="🪙 "+state.coins;$("score").textContent="🏆 "+state.score;$("cool").textContent=skillCd?"✨ "+skillCd.toFixed(1):"✨ 준비"}
function fishColor(i){return["#ffb347","#45c7ff","#ff9f68","#7bd389","#ff6b9a","#b88cff","#7ee7e7","#f5d76e","#ff6f61","#9be15d","#55c1ff","#f78fb3"][i%12]}
function loop(t){let dt=Math.min(.033,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
$("saveNick").onclick=()=>{if($("nick").value.trim()){state.nick=$("nick").value.trim();save();toast("닉네임 저장!")}};
$("start").onclick=start;$("duel").onclick=startDuel;$("aiEdit").onclick=showAIEditor;$("regions").onclick=showRegions;$("leader").onclick=showLeader;$("account").onclick=showAccount;$("friends").onclick=showFriends;$("league").onclick=showLeague;$("ai").onclick=aiBattle;$("idle").onclick=idle;
$("attack").onpointerdown=attack;$("skill").onpointerdown=skill;$("run").onpointerdown=()=>fast=true;$("run").onpointerup=$("run").onpointercancel=()=>fast=false;
let joyActive=false,joyPointerId=null;
function joystickSet(clientX,clientY){
  const r=$("joy").getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy;
  const max=46,d=Math.hypot(dx,dy)||1;
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  moveX=dx/max;moveY=dy/max;
  $("stick").style.transform="translate("+dx+"px,"+dy+"px)";
}
function joystickStop(){
  joyActive=false;joyPointerId=null;moveX=0;moveY=0;
  $("stick").style.transform="translate(0,0)";
}
$("joy").addEventListener("pointerdown",e=>{
  if(!running)return;
  e.preventDefault();joyActive=true;joyPointerId=e.pointerId;
  try{$("joy").setPointerCapture(e.pointerId)}catch(_){}
  joystickSet(e.clientX,e.clientY);
},{passive:false});
$("joy").addEventListener("pointermove",e=>{
  if(!joyActive||e.pointerId!==joyPointerId)return;
  e.preventDefault();joystickSet(e.clientX,e.clientY);
},{passive:false});
$("joy").addEventListener("pointerup",e=>{
  if(e.pointerId===joyPointerId)joystickStop();
},{passive:false});
$("joy").addEventListener("pointercancel",joystickStop,{passive:false});
$("joy").addEventListener("lostpointercapture",()=>{if(joyActive)joystickStop()});

$("joy").addEventListener("touchstart",e=>{
  if(!running)return;
  e.preventDefault();
  const t=e.changedTouches[0];
  joyActive=true;joyPointerId=t.identifier;
  joystickSet(t.clientX,t.clientY);
},{passive:false});
$("joy").addEventListener("touchmove",e=>{
  if(!joyActive)return;
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyPointerId){joystickSet(t.clientX,t.clientY);break}
  }
},{passive:false});
$("joy").addEventListener("touchend",e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyPointerId){joystickStop();break}
  }
},{passive:false});
$("joy").addEventListener("touchcancel",joystickStop,{passive:false});
idle();render();requestAnimationFrame(loop);
</script>
