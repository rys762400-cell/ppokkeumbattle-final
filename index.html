<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#062c43;color:#fff}
button{min-height:46px;border:0;border-radius:13px;padding:10px 14px;font-weight:700;font-size:15px}
#menu{height:100%;overflow:auto;padding:12px;text-align:center;background:linear-gradient(#06324c,#087e9e)}
.card{background:#06283ddd;border-radius:16px;padding:12px;margin:9px 0}
input{width:100%;padding:12px;border:0;border-radius:10px;font-size:16px;margin:5px 0}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.small{font-size:12px;opacity:.82}
#fishBox{height:170px;display:flex;align-items:center;justify-content:center}
.fish{position:relative;width:150px;height:90px;filter:drop-shadow(0 0 8px #fff8)}
.fish .body{position:absolute;left:42px;top:20px;width:90px;height:55px;border:5px solid #073047;border-radius:55% 48% 48% 55%;background:#ffb347}
.fish .tail{position:absolute;left:5px;top:21px;border-style:solid;border-width:27px 42px 27px 0;border-color:transparent #ffb347 transparent transparent}
.fish .eye{position:absolute;left:108px;top:34px;width:11px;height:11px;border-radius:50%;background:#073047;box-shadow:0 0 0 4px #fff}
#game{display:none;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{display:none;position:fixed;top:7px;left:7px;right:7px;z-index:4;gap:6px;flex-wrap:wrap}
.h{background:#06283de8;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}
.ctrl{display:none;position:fixed;z-index:5;border-radius:50%;width:82px;height:82px}
#attack{right:16px;bottom:16px;background:#ffd34e}#skill{right:16px;bottom:112px;background:#d69aff}#run{right:112px;bottom:16px;background:#76e6ff}
#joy{display:none;position:fixed;z-index:5;left:16px;bottom:16px;width:122px;height:122px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55}
#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ffffffaa}
#modal{display:none;position:fixed;z-index:20;left:7%;right:7%;top:8%;bottom:8%;overflow:auto;background:#06283cf8;border-radius:18px;padding:16px}
#toast{display:none;position:fixed;z-index:50;left:50%;top:15%;transform:translateX(-50%);padding:12px 16px;background:#061f32f5;border-radius:13px;font-weight:700}
</style>
</head>
<body>
<div id="menu">
<h1>🐟 뻐끔뻐끔 배틀</h1>
<div class="small">동해에서는 ⭐ 악마의 불가사리로 시작해.</div>
<div id="fishBox"><div class="fish"><div class="body"></div><div class="tail"></div><div class="eye"></div></div></div>
<h2 id="fishName">악마의 불가사리</h2><div id="stats"></div><div id="best"></div>
<div class="card"><b>👤 닉네임</b><input id="nick" maxlength="12" placeholder="닉네임"><button id="nickBtn">저장</button></div>
<div class="card"><div class="row">
<button id="stageBtn">🌊 지역 옮기기</button><button id="battleBtn">🍀 강화 대결</button>
<button id="leaderBtn">👑 리더 인증</button><button id="accountBtn">🔑 계정 연동</button>
<button id="friendBtn">👥 친구 초대</button><button id="leagueBtn">🏆 리그</button><button id="idleBtn">🌙 방치 성장</button>
</div></div>
<div class="card"><b>🐠 물고기 수집</b><p class="small">맵에서 물고기를 먹으면 1마리씩 채워지고 필요한 수를 채우면 해제돼.</p><div id="fishList" class="row"></div></div>
<div class="card"><b>👥 동료</b><div id="team">각자 따로 움직여.</div></div>
<button id="start" style="background:#ffd34e">⚔️ 전투 시작</button>
</div>
<canvas id="game"></canvas>
<div id="hud"><span class="h" id="wave"></span><span class="h" id="hp"></span><span class="h" id="level"></span><span class="h" id="coin"></span><span class="h" id="score"></span><span class="h" id="skillState"></span></div>
<div id="joy"><div id="stick"></div></div>
<button class="ctrl" id="run">💨<br>달리기</button><button class="ctrl" id="skill">✨<br>스킬</button><button class="ctrl" id="attack">⚔️<br>공격</button>
<div id="modal"></div><div id="toast"></div>
<script>
"use strict";
const LEADER_CODE="50974266";
const fish=[
["⭐","악마의 불가사리",12,110],["🐡","복어",16,125],["🐟","멸치",10,90],["🐠","산호 물고기",14,120],
["🦈","상어",25,180],["🐙","문어",30,210],["🪼","해파리",34,230],["🐢","바다거북",39,260],
["🐋","전설 고래",48,320],["🐉","해룡",62,390],["🦑","심해 오징어",72,440],["🐬","돌고래",78,470]];
const stages=[["동해",80,[0,1,2,3,4]],["지중해",100,[1,2,4,5]],["북해",150,[3,5,6,7]],["카리브해",200,[2,4,7,8]],["태평양",300,[6,7,8,9,10,11]],["???해",500,[8,9,10,11]]];
const need=[1,5,10,15,20,25,30,35,40,45,50,55];
function accountCode(){let c=localStorage.getItem("PBB_ACCOUNT_CODE");if(!/^\d{8}$/.test(c||"")){c=String(Math.floor(10000000+Math.random()*90000000));localStorage.setItem("PBB_ACCOUNT_CODE",c)}return c}
let state={nick:"플레이어",sel:0,unlocked:1,coins:50,lv:1,xp:0,growth:1,stage:0,cleared:0,link:accountCode(),fishCount:Array(fish.length).fill(0),score:0,highScore:0,aiBonus:0,friends:[],idlePower:0,lastSeen:Date.now()};
try{const s=JSON.parse(localStorage.getItem("PBB_FINAL"));if(s)state={...state,...s}}catch(e){}
state.link=state.link||accountCode();if(!Array.isArray(state.fishCount))state.fishCount=Array(fish.length).fill(0);
while(state.fishCount.length<fish.length)state.fishCount.push(0);
if(!Array.isArray(state.friends))state.friends=[];if(typeof state.highScore!=="number")state.highScore=0;if(typeof state.aiBonus!=="number")state.aiBonus=0;if(typeof state.idlePower!=="number")state.idlePower=0;if(typeof state.lastSeen!=="number")state.lastSeen=Date.now();
const $=id=>document.getElementById(id);const canvas=$("game"),ctx=canvas.getContext("2d");let running=false,player=null,enemies=[],pickups=[],wave=1,time=20,attackCd=0,skillCd=0,run=false,mx=0,my=0,saveT=0;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();
function save(){state.lastSeen=Date.now();localStorage.setItem("PBB_FINAL",JSON.stringify(state))}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",1500)}
function fishColor(i){return["#ffb347","#45c7ff","#ff9f68","#7bd389","#ff6b9a","#b88cff","#7ee7e7","#f5d76e","#ff6f61","#9be15d","#55c1ff","#f78fb3"][i%12]}
function sound(a,b,d=.1){try{const c=window.ac||(window.ac=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.frequency.value=a;o.connect(g);g.connect(c.destination);g.gain.value=.06;o.start();o.frequency.exponentialRampToValueAtTime(b,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function render(){if(state.sel>=state.unlocked){state.sel=0} $("nick").value=state.nick;$("fishName").textContent=fish[state.sel][1];$("stats").textContent="⚔️ "+Math.round(fish[state.sel][2]*state.growth+state.aiBonus+state.idlePower)+"　❤️ "+Math.round(fish[state.sel][3]*state.growth)+"　⭐ Lv."+state.lv;$("best").textContent="🏆 최고 점수 "+state.highScore+"점";$("fishList").innerHTML="";
fish.forEach((f,i)=>{let b=document.createElement("button");b.textContent=(i<state.unlocked?f[0]+" "+f[1]:"🔒 "+f[1])+" ("+(state.fishCount[i]||0)+"/"+need[i]+")";b.disabled=i>=state.unlocked;b.onclick=()=>{state.sel=i;save();render()};$("fishList").appendChild(b)})}
function closeModal(){$("modal").style.display="none"}
function openStage(){$("modal").style.display="block";$("modal").innerHTML="<button id='close'>닫기</button><h2>🌊 지역</h2>"+stages.map((s,i)=>"<div class='card'><b>"+(i+1)+". "+s[0]+"</b><br>"+s[1]+" 웨이브<br><button "+(i<=state.cleared?"":"disabled")+" data-s='"+i+"'>"+(i<=state.cleared?"입장":"🔒 잠김")+"</button></div>").join("");$("close").onclick=closeModal;$("modal").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{state.stage=+b.dataset.s;save();closeModal();render()})}
function openLeader(){$("modal").style.display="block";$("modal").innerHTML="<button id='close'>닫기</button><h2>👑 리더 인증</h2><input id='li' inputmode='numeric' maxlength='8' placeholder='리더 코드'><button id='verify'>인증하기</button>";$("close").onclick=closeModal;$("verify").onclick=()=>{if($("li").value===LEADER_CODE){toast("👑 리더 인증 성공!");closeModal()}else toast("❌ 코드가 틀렸어.")}}
function openAccount(){$("modal").style.display="block";$("modal").innerHTML="<button id='close'>닫기</button><h2>🔑 계정 연동</h2><p>내 연동 번호</p><input readonly value='"+state.link+"'><p class='small'>이 번호를 보관하면 돼.</p>";$("close").onclick=closeModal}
function friendPanel(){$("modal").style.display="block";let code=localStorage.getItem("PBB_FRIEND_CODE")||String(Math.floor(100000+Math.random()*900000));localStorage.setItem("PBB_FRIEND_CODE",code);let link=location.href.split("#")[0]+"#friend="+code;$("modal").innerHTML="<button id='close'>닫기</button><h2>👥 친구 초대</h2><p>친구 코드: <b>"+code+"</b></p><input readonly value='"+link+"'><button id='copy'>📋 링크 복사</button><button id='accept'>✅ 친구 수락</button>";$("close").onclick=closeModal;$("copy").onclick=()=>{navigator.clipboard?.writeText(link);toast("📋 복사 완료")};$("accept").onclick=()=>{if(!state.friends.includes("친구"))state.friends.push("친구");save();toast("👥 친구 수락!");}}
function league(){if(!state.friends.length){toast("👥 먼저 친구를 추가해 줘.");return}let opp=30+Math.floor(Math.random()*Math.max(50,state.highScore+1));let me=state.score+Math.floor(Math.random()*100);let win=me>=opp;if(win)state.score+=50;if(state.score>state.highScore)state.highScore=state.score;save();toast(win?"🏆 리그전 승리!":"💥 리그전 패배!");render()}
function idle(){let cycles=Math.min(144,Math.floor((Date.now()-state.lastSeen)/18000000));if(cycles>0){state.idlePower+=cycles;state.coins+=cycles*5;state.xp+=cycles*10;while(state.xp>=100){state.xp-=100;state.lv++;state.growth+=.03}save();toast("🌙 방치 성장 +"+cycles)}else toast("🌙 아직 5시간이 지나지 않았어.");render()}
function aiBattle(){$("modal").style.display="block";$("modal").innerHTML="<button id='close'>닫기</button><h2>🍀 운이 좋으면 강화되는 대결</h2><p>승리하면 공격력 +0.5, 패배하면 -0.5</p><button id='fight'>🍀 대결 시작</button><div id='res' class='card'>준비 완료</div>";$("close").onclick=closeModal;$("fight").onclick=()=>{let me=fish[state.sel],opp=fish[Math.floor(Math.random()*state.unlocked)],a=me[2]*state.growth+state.lv*3+state.aiBonus+state.idlePower+Math.random()*30,b=opp[2]+Math.random()*30,win=a>=b;state.aiBonus=win?state.aiBonus+.5:Math.max(-10,state.aiBonus-.5);if(win)state.coins+=10;else state.coins=Math.max(0,state.coins-2);save();$("res").innerHTML=(win?"🏆 승리! 공격력 +0.5":"💥 패배! 공격력 -0.5")+"<br>내 전투력 "+Math.round(a)+" / 상대 "+Math.round(b);render()}}
function begin(){if(!stages[state.stage][2].includes(state.sel)){toast("❌ 이 지역에서 사용할 수 없는 물고기야.");return}running=true;wave=1;time=20;attackCd=0;skillCd=0;mx=my=0;player={x:canvas.width/2,y:canvas.height/2,r:25,hp:fish[state.sel][3]*state.growth,max:fish[state.sel][3]*state.growth,atk:fish[state.sel][2]*state.growth+state.aiBonus+state.idlePower};enemies=[];pickups=[];for(let i=0;i<6;i++)spawnEnemy();$("menu").style.display="none";canvas.style.display="block";$("hud").style.display="flex";["joy","attack","skill","run"].forEach(x=>$(x).style.display="block");toast("⚔️ 전투 시작!")}
function spawnEnemy(){let pool=stages[state.stage][2],fi=pool[Math.floor(Math.random()*pool.length)];enemies.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:18,fi,hp:50+wave*4,max:50+wave*4,spd:50+Math.random()*50,tx:Math.random()*canvas.width,ty:Math.random()*canvas.height,t:0})}
function update(dt){if(!running)return;attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);player.x=Math.max(20,Math.min(canvas.width-20,player.x+mx*(run?300:180)*dt));player.y=Math.max(20,Math.min(canvas.height-20,player.y+my*(run?300:180)*dt));time-=dt;if(time<=0){time=20;if(wave<stages[state.stage][1])wave++;else{state.cleared=Math.max(state.cleared,state.stage+1);save();end();toast("🏆 지역 클리어!");return}}if(enemies.length<14&&Math.random()<dt*.25)spawnEnemy();if(Math.random()<dt*.8&&pickups.length<8){let pool=stages[state.stage][2],fi=pool[Math.floor(Math.random()*pool.length)];pickups.push({x:30+Math.random()*(canvas.width-60),y:40+Math.random()*(canvas.height-100),fi,r:15})}
for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){state.fishCount[p.fi]++;state.score+=10;if(state.score>state.highScore)state.highScore=state.score;sound(420,700,.08);let n=need[p.fi];toast("🐟 "+fish[p.fi][1]+" +10점 "+state.fishCount[p.fi]+"/"+n);if(state.fishCount[p.fi]>=n&&p.fi>=state.unlocked){state.unlocked=Math.min(fish.length,p.fi+1);toast("🎉 "+fish[p.fi][1]+" 해제!")}pickups.splice(i,1);save()}}
for(let e of enemies){e.t-=dt;if(e.t<=0){e.t=1+Math.random()*2;e.tx=Math.random()*canvas.width;e.ty=Math.random()*canvas.height}let dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(Math.hypot(player.x-e.x,player.y-e.y)<45)player.hp-=7*dt}if(player.hp<=0){end();toast("💫 전투 종료")}}
function attack(){if(!running||attackCd>0)return;attackCd=.1;sound(160,70,.12);for(let e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<110){e.hp-=player.atk;if(e.hp<=0){state.score+=20;if(state.score>state.highScore)state.highScore=state.score;sound(140,60,.15);e.dead=true}}enemies=enemies.filter(e=>!e.dead);save()}
function skill(){if(!running||skillCd>0)return;skillCd=8;sound(600,1100,.2);for(let e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<230)e.hp-=player.atk*4;enemies=enemies.filter(e=>e.hp>0);toast("✨ 스킬 발동!")}
function end(){running=false;["hud","joy","attack","skill","run"].forEach(x=>$(x).style.display="none");canvas.style.display="none";$("menu").style.display="block";render()}
function drawFish(x,y,r,color){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.strokeStyle="#073047";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,r,r*.65,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-r*.7,0);ctx.lineTo(-r*1.35,-r*.65);ctx.lineTo(-r*1.35,r*.65);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(r*.45,-r*.2,r*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#073047";ctx.beginPath();ctx.arc(r*.48,-r*.2,r*.08,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){if(!running)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#087e9e";ctx.fillRect(0,0,canvas.width,canvas.height);for(let p of pickups){ctx.beginPath();ctx.strokeStyle="#bdf7ff";ctx.lineWidth=3;ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);ctx.stroke()}for(let e of enemies){drawFish(e.x,e.y,e.r,fishColor(e.fi));ctx.fillStyle="#222";ctx.fillRect(e.x-18,e.y-e.r-9,36,4);ctx.fillStyle="#7cff7c";ctx.fillRect(e.x-18,e.y-e.r-9,36*Math.max(0,e.hp/e.max),4)}drawFish(player.x,player.y,30,fishColor(state.sel));$("wave").textContent="🌊 "+wave+"/"+stages[state.stage][1];$("hp").textContent="❤️ "+Math.ceil(player.hp);$("level").textContent="⭐ Lv."+state.lv;$("coin").textContent="🪙 "+state.coins;$("score").textContent="🏆 "+state.score;$("skillState").textContent=skillCd?"✨ "+skillCd.toFixed(1):"✨ 준비"}
function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
$("nickBtn").onclick=()=>{let v=$("nick").value.trim();if(v){state.nick=v;save();toast("닉네임 저장!")}};
$("stageBtn").onclick=openStage;$("battleBtn").onclick=aiBattle;$("leaderBtn").onclick=openLeader;$("accountBtn").onclick=openAccount;$("friendBtn").onclick=friendPanel;$("leagueBtn").onclick=league;$("idleBtn").onclick=idle;$("start").onclick=begin;$("attack").onpointerdown=attack;$("skill").onpointerdown=skill;$("run").onpointerdown=()=>run=true;$("run").onpointerup=$("run").onpointercancel=()=>run=false;
let jd=false;function setJoy(e){let r=$("joy").getBoundingClientRect(),x=e.clientX-r.left-61,y=e.clientY-r.top-61,d=Math.hypot(x,y)||1,m=43;if(d>m){x=x/d*m;y=y/d*m}mx=x/m;my=y/m;$("stick").style.transform="translate("+x+"px,"+y+"px)"}$("joy").onpointerdown=e=>{jd=true;$("joy").setPointerCapture(e.pointerId);setJoy(e)};$("joy").onpointermove=e=>jd&&setJoy(e);$("joy").onpointerup=()=>{jd=false;mx=my=0;$("stick").style.transform="translate(0,0)"};
function idleCatchup(){let c=Math.min(144,Math.floor((Date.now()-state.lastSeen)/18000000));if(c>0){state.idlePower+=c;state.coins+=c*5;state.xp+=c*10;while(state.xp>=100){state.xp-=100;state.lv++;state.growth+=.03}save()}}
idleCatchup();render();requestAnimationFrame(loop);
</script>
</body>
</html>
